name: Publish statically reviewed deliveries
on:
  push:
    branches: ['transport/secure-*']
    paths: ['.transfer/request.json']
permissions:
  contents: read
concurrency:
  group: cpg-workloads-publication-${{ github.ref_name }}
  queue: max
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  publish:
    if: github.repository == 'Lightcone-ZhangYifa/cpg-workloads'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Receive locked deliveries, inspect static content, publish original bytes
        run: |
          gh auth setup-git
          python tools/publish_deliveries.py
