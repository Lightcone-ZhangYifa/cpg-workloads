name: Publish audited worker packages

on:
  push:
    branches:
      - 'publish-workers/worker-*'

permissions:
  contents: write

concurrency:
  group: cpg-workloads-publication
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Lightcone-ZhangYifa/cpg-workloads'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify worker publication failure handling
        run: python3 -m unittest discover -s tests -p 'test_worker_publication.py' -v
      - name: Reproduce and publish the explicitly requested worker plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#publish-workers/}"
          python3 tools/publish_workers.py publish "$tag" --output "$RUNNER_TEMP/worker-release"
      - name: Preserve verified publication receipt and merge the package manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#publish-workers/}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B worker-publication-receipt origin/main
            python3 tools/publish_workers.py record "$RUNNER_TEMP/worker-release/publication.json"
            git add "catalog/releases/$tag.json" manifest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record verified $tag release and merge package manifest"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
